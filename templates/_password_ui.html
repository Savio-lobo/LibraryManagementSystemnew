{# Shared password helper: show/hide eye icon on every password field and a live
   requirement warning (only when something is missing) on fields marked data-pw-checklist. No length rule. #}
<style>
.pw-wrap{position:relative;display:block;width:100%}
.pw-wrap>input{width:100%;box-sizing:border-box;padding-right:44px !important}
.pw-wrap .pw-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);width:auto;height:auto;
margin:0;padding:4px;border:0;border-radius:0;background:transparent;color:#6b7280;cursor:pointer;
display:flex;align-items:center;justify-content:center;line-height:0;transition:none}
.pw-wrap .pw-eye:hover,.pw-wrap .pw-eye:focus{background:transparent;color:#374151;outline:none;transform:translateY(-50%)}
.pw-wrap .pw-eye svg{width:20px;height:20px}
.pw-msg{margin:6px 0 0;font-size:13px;line-height:1.4;color:#ffe4e6;font-weight:500;text-align:left;display:none}
</style>
<script>
(function () {
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  var RULES = [
    ['one uppercase letter', /[A-Z]/],
    ['one lowercase letter', /[a-z]/],
    ['one number', /[0-9]/],
    ['one special character', /[^A-Za-z0-9]/]
  ];
  function setup(input) {
    var wrap = document.createElement('span');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pw-eye';
    btn.setAttribute('aria-label', 'Show password');
    btn.innerHTML = EYE;
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
    wrap.appendChild(btn);

    if (input.hasAttribute('data-pw-checklist')) {
      var msg = document.createElement('div');
      msg.className = 'pw-msg';
      wrap.parentNode.insertBefore(msg, wrap.nextSibling);
      var update = function () {
        var v = input.value, missing = [];
        RULES.forEach(function (r) { if (!r[1].test(v)) missing.push(r[0]); });
        if (!v || !missing.length) { msg.style.display = 'none'; msg.textContent = ''; return; }
        var text = missing.length === 1 ? missing[0]
          : missing.slice(0, -1).join(', ') + ' and ' + missing[missing.length - 1];
        msg.textContent = 'Password must contain at least ' + text + '.';
        msg.style.display = 'block';
      };
      input.addEventListener('input', update);
      update();
    }
  }
  function init() {
    var list = document.querySelectorAll('input[type="password"]');
    for (var i = 0; i < list.length; i++) setup(list[i]);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
