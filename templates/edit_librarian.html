<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Librarian | Library Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="page-container">

    <div class="book-card" style="max-width: 650px;">

        <div class="icon">

            <i class="fa-solid fa-user-tie"></i>

        </div>


        <h2>Edit Librarian</h2>

        <p class="subtitle">
            Update the librarian's details below.
        </p>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- EDIT FORM -->

        <form method="POST"
              action="{{ url_for('edit_librarian', email=librarian.get('email')) }}">


            <!-- NAME -->

            <div class="input-group">

                <label for="name">

                    <i class="fa-solid fa-user"></i>

                    Name

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ librarian.get('name', '') }}"
                    placeholder="Enter name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">

                    <i class="fa-solid fa-envelope"></i>

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ librarian.get('email', '') }}"
                    placeholder="Enter email"
                    required>

            </div>


            <!-- ROLE (read-only, always Librarian) -->

            <div class="input-group">

                <label for="role">

                    <i class="fa-solid fa-user-shield"></i>

                    Role

                </label>

                <input
                    type="text"
                    id="role"
                    value="Librarian"
                    disabled>

            </div>


            <!-- UPDATE BUTTON -->

            <button type="submit">

                <i class="fa-solid fa-save"></i>

                Update Librarian

            </button>

        </form>


        <hr style="margin: 30px 0;">


        <!-- BACK -->

        <a
            class="back-home"
            href="{{ url_for('user_librarian_management') }}">

            <i class="fa-solid fa-arrow-left"></i>

            Back to User & Librarian Management

        </a>

    </div>

</div>


</body>

</html>
