<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Library Management System</title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="form-container">


    <div class="form-card">


        <!-- PROFILE ICON -->

        <div class="icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <!-- TITLE -->

        <h2>
            Edit Profile
        </h2>


        <p class="subtitle">

            Update your personal information below.

        </p>



        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <!-- PROFILE FORM -->

        <form action="{{ url_for('profile') }}"
              method="POST">


            <!-- NAME -->

            <div class="input-group">

                <label for="name">

                    <i class="fa-solid fa-user"></i>

                    Full Name

                </label>


                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user.get('name', '') }}"
                    placeholder="Enter your full name"
                    required>

            </div>



            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">

                    <i class="fa-solid fa-envelope"></i>

                    Email Address

                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.get('email', '') }}"
                    readonly>

            </div>



            <!-- UPDATE BUTTON -->

            <button type="submit">

                <i class="fa-solid fa-floppy-disk"></i>

                Update Profile

            </button>


        </form>



        <hr>



        <!-- BACK TO CORRECT DASHBOARD -->

        <a class="back-home"
           href="{{ url_for('back_to_dashboard') }}">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </a>


    </div>


</div>


</body>

</html>
