<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | Library Management System</title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>


<body>


<div class="page-container">


    <div class="form-card">


        <!-- ICON -->

        <div class="icon">

            <i class="fa-solid fa-lock"></i>

        </div>



        <!-- TITLE -->

        <h2>
            Change Password
        </h2>


        <p class="subtitle">

            Keep your account secure by updating your password regularly.

        </p>



        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <!-- FORM -->

        <form action="{{ url_for('change_password') }}"
              method="POST">


            <!-- CURRENT PASSWORD -->

            <div class="input-group">

                <label>

                    <i class="fa-solid fa-key"></i>

                    Current Password

                </label>


                <input
                    type="password"
                    name="old_password"
                    placeholder="Enter current password"
                    required>

            </div>



            <!-- NEW PASSWORD -->

            <div class="input-group">

                <label>

                    <i class="fa-solid fa-lock"></i>

                    New Password

                </label>


                <input
                    type="password"
                    name="new_password" data-pw-checklist
                    placeholder="Enter new password"
                    required>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>

                    <i class="fa-solid fa-shield-halved"></i>

                    Confirm New Password

                </label>


                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required>

            </div>



            <!-- UPDATE -->

            <button type="submit">

                <i class="fa-solid fa-arrows-rotate"></i>

                Update Password

            </button>


        </form>



        <hr>



        <!-- BACK TO CORRECT DASHBOARD -->

        <a class="back-home"
           href="{{ url_for('back_to_dashboard') }}">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </a>


    </div>


</div>


{% include '_password_ui.html' %}
</body>

</html>
